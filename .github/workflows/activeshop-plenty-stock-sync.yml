name: ActiveShop to Plenty STOCK Sync V8

on:
  workflow_dispatch:
  schedule:
    # Saatte bir en fazla 200 SKU kontrol edilir.
    # Dogruluk hizdan onemli: stok yazilan urunler iki depodan tekrar okunur.
    - cron: "11 * * * *"

permissions:
  contents: write

concurrency:
  group: activeshop-plenty-stock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      ACTIVESHOP_HOST: https://b2b.activeshop.com.pl
      ACTIVESHOP_STORE_CODE: B2B_PL_de

      # REST/API hesabi: katalog ve API erisimi.
      ACTIVESHOP_USERNAME: ${{ secrets.ACTIVESHOP_USERNAME }}
      ACTIVESHOP_PASSWORD: ${{ secrets.ACTIVESHOP_PASSWORD }}

      # B2B web hesabi: tarayicida "Auf Lager" stok degerini gormek icin.
      # API hesabindan ayridir.
      ACTIVESHOP_B2B_USERNAME: ${{ secrets.ACTIVESHOP_B2B_USERNAME }}
      ACTIVESHOP_B2B_PASSWORD: ${{ secrets.ACTIVESHOP_B2B_PASSWORD }}
      ACTIVESHOP_PROXY_URL: ${{ secrets.ACTIVESHOP_PROXY_URL }}

      # Hedef stok API physical stock_qty degil, B2B urun sayfasindaki
      # "Auf Lager: N Stck." degeridir. Alman B2B storefront /de altindadir.
      ACTIVESHOP_FRONTEND_BASE_URL: https://b2b.activeshop.com.pl/de
      ACTIVESHOP_PUBLIC_FRONTEND_BASE_URL: https://activeshop.com.pl/de
      ACTIVESHOP_FRONTEND_TIMEOUT: "45"
      ACTIVESHOP_FRONTEND_REQUEST_SLEEP: "0.20"
      ACTIVESHOP_BROWSER_NAV_TIMEOUT: "45"
      ACTIVESHOP_BROWSER_STOCK_WAIT_SECONDS: "8"

      PLENTY_BASE_URL: ${{ secrets.PLENTY_BASE_URL }}
      PLENTY_USERNAME: ${{ secrets.PLENTY_USERNAME }}
      PLENTY_PASSWORD: ${{ secrets.PLENTY_PASSWORD }}

      PLENTY_ENABLE_WRITE: ${{ vars.PLENTY_ENABLE_WRITE || 'false' }}
      UPDATE_PURCHASE_PRICE: "false"
      UPDATE_STOCK: "true"
      UPDATE_SALES_PRICE: "false"

      # ActiveShop saleable stogu iki Plenty deposuna ayni hedef olarak yazilir.
      # Global Lager = warehouse 1, Active Shop = warehouse 2.
      PLENTY_WAREHOUSE_ID: "2"
      PLENTY_ACTIVE_WAREHOUSE_ID: "2"
      PLENTY_GLOBAL_WAREHOUSE_ID: "1"
      PLENTY_STORAGE_LOCATION_ID: ${{ vars.PLENTY_STORAGE_LOCATION_ID }}
      PLENTY_ACTIVE_STORAGE_LOCATION_ID: ${{ vars.PLENTY_STORAGE_LOCATION_ID }}
      # Global Lager icin ayri location verilmediyse Plenty default location 0 kullanilir.
      PLENTY_GLOBAL_STORAGE_LOCATION_ID: ${{ vars.PLENTY_GLOBAL_STORAGE_LOCATION_ID || '0' }}

      STOCK_SAFETY_DEDUCTION: ${{ vars.STOCK_SAFETY_DEDUCTION || '0' }}
      STOCK_MAXIMUM: ${{ vars.STOCK_MAXIMUM || '999999' }}

      # SYNCED ancak iki depodan tekrar okunan fiziksel stok hedefe esitse verilir.
      STOCK_VERIFY_ATTEMPTS: "3"
      STOCK_VERIFY_DELAY: "3"

      INPUT_CSV: input/Global Fiyat Guncelleme.csv
      OUTPUT_CSV: output/stock_sync.csv
      FAILED_CSV: output/stock_failed_products.csv
      SUMMARY_JSON: output/stock_run_summary.json
      STATE_JSON: state/stock_sync_progress.json

      MAX_PRODUCTS_PER_RUN: "200"
      MAX_RUN_MINUTES: "50"
      CHECKPOINT_EVERY: "20"
      ACTIVESHOP_REQUEST_SLEEP: "0.90"
      ACTIVESHOP_REQUEST_JITTER: "0.25"
      ACTIVESHOP_RATE_RETRIES: "4"
      ACTIVESHOP_RATE_BASE_WAIT: "20"
      ACTIVESHOP_RATE_MAX_WAIT: "180"
      PLENTY_WRITE_INTERVAL: "1.70"
      PLENTY_MAX_RETRIES: "5"

    steps:
      - name: Repository dosyalarini al
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutuphaneleri kur
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Chromium kur
        run: python -m playwright install --with-deps chromium

      - name: CSV ve stok ayarlarini kontrol et
        run: python run_stock_sync_b2b_separate_login.py --validate-only

      - name: ActiveShop Auf Lager stoklarini iki Plenty deposuna yaz ve dogrula
        run: python run_stock_sync_b2b_separate_login.py

      - name: Stok sonuclarini artifact olarak yukle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: activeshop-plenty-stock-${{ github.run_number }}
          path: |
            output/stock_sync.csv
            output/stock_failed_products.csv
            output/stock_run_summary.json
            state/stock_sync_progress.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stok progress ve raporlarini repositoryye kaydet
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- output/stock_sync.csv output/stock_failed_products.csv output/stock_run_summary.json state/stock_sync_progress.json
          if git diff --cached --quiet; then
            echo "Degisiklik yok; commit olusturulmadi."
          else
            git commit -m "chore: sync ActiveShop stock to Plenty"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
